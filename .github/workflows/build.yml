name: Build Onyxgram IPA

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Show environment
        run: |
          sw_vers || true
          df -h /
          echo "Available Xcode versions:"
          ls /Applications | grep -i Xcode || true

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          echo "versions.json wants Xcode $XCODE_VERSION"
          if [ -d "/Applications/Xcode_$XCODE_VERSION.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"
          else
            echo "Xcode_$XCODE_VERSION.app not found, using default:"
            xcode-select -p
          fi
          xcodebuild -version || true

      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/bazel-disk-cache
          key: bazel-disk-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios
          sudo mkdir -p /Users/Shared
          sudo cp -R "$GITHUB_WORKSPACE" "$SOURCE_DIR"
          sudo chown -R "$(whoami)" "$SOURCE_DIR"

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          # the fake profiles ship tied to ph.telegra.Telegraph; rewrite + re-sign
          # them for our bundle id so codesigning matches (see RewriteFakeProfiles.py)
          NEW_BUNDLE_ID=$(cat build-system/appstore-configuration.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["bundle_id"])')
          python3 build-system/Make/RewriteFakeProfiles.py \
            --profilesPath=build-system/fake-codesigning/profiles \
            --certsPath=build-system/fake-codesigning/certs \
            --oldBundleId=ph.telegra.Telegraph \
            --newBundleId="$NEW_BUNDLE_ID"

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$HOME/bazel-disk-cache" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa — bazel-bin is the stable convenience symlink to the build output
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          IPA_SRC="bazel-bin/Telegram/Telegram.ipa"
          if [ ! -f "$IPA_SRC" ]; then
            IPA_SRC="$(find -L bazel-out -type f -name 'Telegram.ipa' -path '*/bin/Telegram/*' | head -n1)"
          fi
          echo "Using IPA at: $IPA_SRC"
          [ -f "$IPA_SRC" ] || { echo "Telegram.ipa not found"; exit 1; }
          cp "$IPA_SRC" "$OUTPUT_PATH/Onyxgram.ipa"

          # collect dsym
          mkdir -p build/DSYMs
          for f in bazel-bin/Telegram/*.dSYM; do
            [ -e "$f" ] && cp -R "$f" build/DSYMs/
          done
          zip -r "./$OUTPUT_PATH/Onyxgram.DSYMs.zip" build/DSYMs 1>/dev/null

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Onyxgram-ipa-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Onyxgram.ipa
          if-no-files-found: error

      - name: Upload DSYM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Onyxgram-dsym-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Onyxgram.DSYMs.zip
          if-no-files-found: warn
